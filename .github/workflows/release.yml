name: Release ZapretDrum

# Запускается автоматически, когда вы отправляете тег вида v1.0.1, v1.2.0 и т.д.:
#   git tag v1.0.1
#   git push origin v1.0.1
#
# Дальше всё происходит само: Windows-сборка на серверах GitHub, PyInstaller,
# Inno Setup, и публикация готового ZapretDrum-Setup.exe как GitHub Release.
# Ничего скачивать/собирать вручную не нужно.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # нужно, чтобы Actions мог создать релиз

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Извлечь номер версии из тега (v1.2.3 -> 1.2.3)
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "$VERSION" > VERSION
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Версия релиза: $VERSION"

      - name: Установить зависимости Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Собрать ZapretDrum.exe
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed
          --name ZapretDrum --uac-admin
          --icon=assets\icon.ico
          --add-data "assets\icon.ico;assets"
          --add-data "VERSION;."
          main.py

      - name: Установить Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Собрать установщик (ZapretDrum-Setup.exe)
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=%APP_VERSION% installer\setup.iss

      - name: Опубликовать GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Если релиз с этим тегом уже создан вручную на сайте (обычный
          # случай - там удобнее писать заголовок/описание) - просто
          # прикрепляем к нему собранный файл. Если релиза ещё нет
          # (например, тег запушен через git без создания релиза на
          # сайте) - создаём релиз с нуля.
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" \
              "installer/Output/ZapretDrum-Setup.exe" --clobber
          else
            gh release create "${{ github.ref_name }}" \
              "installer/Output/ZapretDrum-Setup.exe" \
              --title "ZapretDrum ${{ env.APP_VERSION }}" \
              --notes "Автоматическая сборка версии ${{ env.APP_VERSION }}."
          fi
